name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Set this variable in: Repo → Settings → Variables → Actions
          # Name: NEXT_PUBLIC_SHEETS_ENDPOINT
          # Value: https://script.google.com/macros/s/AKfycbztCYuvePynBNPFyCVifr7IOiOmXNuu2IQWCS7Yr_2aYU8tXFamSnaVrKxATlCV5b_VNA/exec
          NEXT_PUBLIC_SHEETS_ENDPOINT: ${{ vars.NEXT_PUBLIC_SHEETS_ENDPOINT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
